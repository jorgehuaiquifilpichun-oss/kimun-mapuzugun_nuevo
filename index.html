<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f31">
  <title>Kimün Mapuzungun</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #183f31; }
    #app { width: 100%; max-width: 480px; min-height: 100dvh; margin: 0 auto; overflow-x: hidden; }
    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <main id="app">
    <!-- CÓDIGO 0: base limpia. Sin recursos ni lógica heredada. -->
    <section id="home" class="screen active"></section>
  </main>

  <script>
    "use strict";

    // Único sistema de navegación de la nueva aplicación.
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(screenId);
      if (target) target.classList.add("active");
    }

    showScreen("home");
  </script>
</body>
</html>
