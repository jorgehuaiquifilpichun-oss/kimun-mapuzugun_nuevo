<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f31">
  <title>Kimün Mapuzungun</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #183f31; }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      overflow-x: hidden;
      background: #183f31;
    }

    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: block; }

    /* PANTALLA DE INICIO — SOLO VISUALIZACIÓN */
    .home-visual {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: #183f31;
    }

    .home-cover {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .home-buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.8dvh, 8px);
      padding: clamp(8px, 1.2dvh, 12px) 4% max(10px, env(safe-area-inset-bottom));
      /* Transparencia verde uniforme en toda la botonera */
      background: rgba(24, 63, 49, 0.58);
    }

    .home-buttons::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -28px;
      height: 28px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(24, 63, 49, 0),
        rgba(24, 63, 49, 0.58)
      );
    }

    .home-link {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .home-button {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }

    /* PANTALLA DE AGRADECIMIENTOS */
    .ack-screen {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: #183f31;
    }

    .ack-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .ack-audio {
      display: none;
    }

    .grammar-screen {
      min-height: 100dvh;
      padding: 22px 16px 28px;
      background: #183f31;
      color: #fffdf4;
    }

    .grammar-title {
      margin: 0 0 6px;
      text-align: center;
      font-size: 1.55rem;
    }

    .grammar-subtitle {
      margin: 0 0 18px;
      text-align: center;
      opacity: .88;
    }

    .guide-list {
      display: grid;
      gap: 10px;
    }

    .guide-link, .grammar-back {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      color: #fffdf4;
      text-decoration: none;
      font-weight: 700;
    }

    .grammar-back {
      margin-top: 18px;
      text-align: center;
      cursor: pointer;
    }

    .home-button-image {
      display: block;
      width: 100%;
      max-height: 12dvh;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    /* CONTROLES DE AGRADECIMIENTOS */
    .ack-controls {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .ack-control {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
    }

    .ack-control img {
      display: block;
      width: 100%;
      height: auto;
    }

    .ack-back {
      top: max(14px, env(safe-area-inset-top));
      left: 7%;
      width: 36%;
    }

    .ack-next {
      top: max(14px, env(safe-area-inset-top));
      right: 7%;
      width: 36%;
    }

    .ack-consult {
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 50%;
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="home-visual">
        <img class="home-cover" src="./portada.png" alt="Kimün Mapuzungun">

        <div class="home-buttons" aria-label="Opciones principales">
          <button class="home-link home-button" type="button" onclick="openAcknowledgements()" aria-label="Comenzar"><img class="home-button-image" src="./boton_comenzar.png" alt="Comenzar"></button>
          <button class="home-link home-button" type="button" onclick="showScreen('grammar')" aria-label="Abrir Apoyo de Gramática"><img class="home-button-image" src="./boton_gramatica.png" alt="Apoyo de Gramática"></button>
          <a class="home-link" href="./diccionario_mapuche.pdf" target="_blank" rel="noopener" aria-label="Abrir Diccionario Mapuche"><img class="home-button-image" src="./boton_diccionario.png" alt="Diccionario Mapuche"></a>
          <img class="home-button-image" src="./boton_grafemario.png" alt="Grafemario y Sonidos">
        </div>
      </div>
    </section>

    <section id="acknowledgements" class="screen">
      <div class="ack-screen">
        <img class="ack-image" src="./pantalla_agradecimientos.png" alt="Agradecimientos">
        <div class="ack-controls" aria-label="Controles de Agradecimientos">
          <button class="ack-control ack-back" type="button" onclick="returnHome()" aria-label="Wiñotxekage, volver al inicio">
            <img src="./boton_volver_atras.png" alt="Wiñotxekage — Volver atrás">
          </button>
          <button class="ack-control ack-next" type="button" aria-label="Amulepe, seguir" title="Disponible para la siguiente etapa">
            <img src="./boton_seguir.png" alt="Amulepe — Seguir">
          </button>
          <button class="ack-control ack-consult" type="button" onclick="openRamtuchi()" aria-label="Ramtuchi, consultar guías y diccionario">
            <img src="./boton_consultar.png" alt="Ramtuchi — Consultar">
          </button>
        </div>
        <audio id="acknowledgementsAudio" class="ack-audio" preload="metadata">
          <source src="./audio_agradecimientos.mp3" type="audio/mpeg">
          Tu navegador no puede reproducir este audio.
        </audio>
      </div>
    </section>

    <section id="grammar" class="screen">
      <div class="grammar-screen">
        <h1 class="grammar-title">Apoyo de Gramática</h1>
        <p class="grammar-subtitle">Guías oficiales de Daniel Pünolef</p>
        <div class="guide-list">
          <a class="guide-link" href="./01_A1.1_Kimeltun_0.pdf" target="_blank" rel="noopener">Guía 1 — Kimeltun 0</a>
          <a class="guide-link" href="./02_A1.1_Mapuzugun_kimeltun_2.pdf" target="_blank" rel="noopener">Guía 2 — Kimeltun 2</a>
          <a class="guide-link" href="./03_Mapuzugun_kimeltun_3.pdf" target="_blank" rel="noopener">Guía 3 — Kimeltun 3</a>
          <a class="guide-link" href="./04_A1.1_2026_Kimeltun_6.pdf" target="_blank" rel="noopener">Guía 4 — Kimeltun 6</a>
          <a class="guide-link" href="./05_A1.1_2026_Kimeltun_7.pdf" target="_blank" rel="noopener">Guía 5 — Kimeltun 7</a>
          <a class="guide-link" href="./06_A1.1_2026_Kimeltun_9.pdf" target="_blank" rel="noopener">Guía 6 — Kimeltun 9</a>
          <a class="guide-link" href="./07_A1.1_2026_Kimeltun_10.pdf" target="_blank" rel="noopener">Guía 7 — Kimeltun 10</a>
          <a class="guide-link" href="./08_A1.1_2026_Kimeltun_11.pdf" target="_blank" rel="noopener">Guía 8 — Kimeltun 11</a>
          <a class="guide-link" href="./09_A1.1_2026_Kimeltun_12.pdf" target="_blank" rel="noopener">Guía 9 — Kimeltun 12</a>
          <a class="guide-link" href="./10_A1.1_2026_Kimeltun_13.pdf" target="_blank" rel="noopener">Guía 10 — Kimeltun 13</a>
        </div>
        <button class="grammar-back" type="button" onclick="showScreen('home')">Volver al inicio</button>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    function openAcknowledgements() {
      showScreen("acknowledgements");
      const audio = document.getElementById("acknowledgementsAudio");
      if (audio) {
        audio.currentTime = 0;
        audio.volume = 0.5;
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(() => {});
        }
      }
    }

    function stopAcknowledgementsAudio() {
      const audio = document.getElementById("acknowledgementsAudio");
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
    }

    function returnHome() {
      stopAcknowledgementsAudio();
      showScreen("home");
    }

    function openRamtuchi() {
      stopAcknowledgementsAudio();
      showScreen("grammar");
    }

    // Sistema central de navegación de la nueva aplicación.
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(screenId);
      if (target) target.classList.add("active");
    }

    showScreen("home");
  </script>
</body>
</html>
