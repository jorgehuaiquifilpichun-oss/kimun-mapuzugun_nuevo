<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f31">
  <title>Kimün Mapuzungun</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #183f31; }
    #app { width: 100%; max-width: 480px; min-height: 100dvh; margin: 0 auto; overflow-x: hidden; }
    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: block; }

    /* PORTADA: solo visualización */
    #home {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #183f31;
    }

    .portada {
      display: block;
      width: 100%;
      height: 100dvh;
      object-fit: cover;
      object-position: center top;
    }

    .menu-inicio {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 82%;
      display: grid;
      gap: 8px;
    }

    .boton-portada {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
    }

    .boton-portada img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main id="app">
    <!-- CÓDIGO 0: base limpia. Sin recursos ni lógica heredada. -->
    <section id="home" class="screen active">
      <img class="portada" src="portada.png" alt="Portada Kimün Mapuzungun">

      <div class="menu-inicio" aria-label="Menú principal">
        <div class="boton-portada"><img src="boton_comenzar.png" alt="Comenzar"></div>
        <div class="boton-portada"><img src="boton_gramatica.png" alt="Apoyo de Gramática"></div>
        <div class="boton-portada"><img src="boton_diccionario.png" alt="Diccionario Mapuzungun"></div>
        <div class="boton-portada"><img src="boton_grafemario.png" alt="Grafemario"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // Único sistema de navegación de la nueva aplicación.
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(screenId);
      if (target) target.classList.add("active");
    }

    showScreen("home");
  </script>
</body>
</html>
