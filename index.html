<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f31">
  <title>Kimün Mapuzungun</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #183f31; }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      overflow-x: hidden;
      background: #183f31;
    }

    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: block; }

    /* PANTALLA DE INICIO — SOLO VISUALIZACIÓN */
    .home-visual {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #183f31;
    }

    .home-cover {
      display: block;
      width: 100%;
      height: auto;
    }

    .home-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 4%;
      background: #183f31;
    }

    .home-button-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="home-visual">
        <img class="home-cover" src="./portada.png" alt="Kimün Mapuzungun">

        <div class="home-buttons" aria-label="Opciones principales">
          <img class="home-button-image" src="./boton_comenzar.png" alt="Comenzar">
          <img class="home-button-image" src="./boton_gramatica.png" alt="Apoyo de Gramática">
          <img class="home-button-image" src="./boton_diccionario.png" alt="Diccionario Mapuche">
          <img class="home-button-image" src="./boton_grafemario.png" alt="Grafemario y Sonidos">
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // Sistema central de navegación de la nueva aplicación.
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(screenId);
      if (target) target.classList.add("active");
    }

    showScreen("home");
  </script>
</body>
</html>
